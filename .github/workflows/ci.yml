# FileFlow CI.
#
# The `core-desktop` job is the important one architecturally: it builds core/ with NO
# Android toolchain present, which turns ADR-0010's "the decode chain must run off-device"
# from a convention into a build failure. Everything else is conventional hygiene.
name: ci

on:
  push:
  pull_request:

jobs:
  core-desktop:
    name: core/ builds with no Android toolchain (ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure core only
        run: cmake --preset core-only
      - name: Build
        run: cmake --build build/core-only -j
      - name: Assert core/ has no Android dependency
        run: |
          if grep -rn --include=*.cpp --include=*.h -E '#include <(android|jni)' core/; then
            echo "::error::core/ must not depend on Android headers (ADR-0010)"
            exit 1
          fi
          echo "core/ is platform-clean"

  tests:
    name: unit tests + golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset desktop-debug
      - run: cmake --build build/desktop-debug -j
      - run: ctest --preset desktop-debug

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset desktop-asan
      - run: cmake --build build/desktop-asan -j
      - name: Run tests under sanitizers
        run: ctest --preset desktop-asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  sim-smoke:
    name: simulator smoke (fixed seeds, must stay deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset desktop-release
      - run: cmake --build build/desktop-release -j
      - name: Identity channel must verify
        run: ./build/desktop-release/sim/ffsim --payload 65536 --noise 0
      - name: Impaired channel must still verify
        run: |
          ./build/desktop-release/sim/ffsim --payload 65536 \
            --noise 12 --shot 0.6 --crosstalk 0.15 --gamma 2.2 \
            --vignetting 0.35 --drop 0.2
      # --no-host-metrics is REQUIRED here, not cosmetic. ffsim also reports decoder throughput
      # and real-time headroom, which are wall-clock measurements of the runner and cannot be
      # identical between two runs. Comparing full stdout made this gate impossible to pass —
      # and because CI had never actually executed, nobody knew (finding F24).
      - name: Determinism — same seed must give identical output
        run: |
          A=$(./build/desktop-release/sim/ffsim --payload 32768 --seed 7 --noise 8 --no-host-metrics)
          B=$(./build/desktop-release/sim/ffsim --payload 32768 --seed 7 --noise 8 --no-host-metrics)
          if [ "$A" != "$B" ]; then
            echo "::error::simulator is non-deterministic; regression tests are meaningless"
            diff <(echo "$A") <(echo "$B") || true
            exit 1
          fi
          echo "deterministic (cell-sample path)"

          # The image path is the stronger check: it renders pixels and runs the whole geometry
          # chain, so it exercises far more floating point than the cell-sample path above.
          # ENGINEERING-PRACTICES flags FP in the decode path as a determinism hazard; this is
          # where that would show up first.
          C=$(./build/desktop-release/sim/ffsim --payload 16384 --seed 3 --image-path \
                --image-size 900 1500 --yaw 8 --no-host-metrics)
          D=$(./build/desktop-release/sim/ffsim --payload 16384 --seed 3 --image-path \
                --image-size 900 1500 --yaw 8 --no-host-metrics)
          if [ "$C" != "$D" ]; then
            echo "::error::image path is non-deterministic — recorded-capture regression testing"
            echo "::error::would be meaningless (ENGINEERING-PRACTICES: FP is the hazard)"
            diff <(echo "$C") <(echo "$D") || true
            exit 1
          fi
          echo "deterministic (image path)"

      # The image path runs the REAL geometry chain (detect/track, rectify, sample,
      # normalise). The cell-sample smoke above cannot catch a regression in any of it.
      - name: Image path must verify, head-on and oblique
        run: |
          ./build/desktop-release/sim/ffsim --payload 16384 --image-path \
            --image-size 1200 2000
          ./build/desktop-release/sim/ffsim --payload 16384 --image-path \
            --image-size 1200 2000 --yaw 15 --pitch 10 --falloff 0.5 --img-glare 60 --blur 1

      # Guards finding F18: intra-frame FEC is load-bearing, not an optimisation. On a
      # channel this impaired the transfer does not complete without it.
      - name: Intra-frame FEC is required on an impaired channel
        run: |
          set +e
          ./build/desktop-release/sim/ffsim --payload 65536 --seed 5 --fec-nsym 0 \
            --noise 26 --shot 0.9 --crosstalk 0.20 --occlusion 0.03 --drop 0.10 \
            --max-frames 4000 > /tmp/nofec.txt 2>&1
          NOFEC=$?
          set -e
          if [ "$NOFEC" = "0" ]; then
            echo "::error::transfer verified WITHOUT intra-frame FEC — the impairment set is"
            echo "::error::too weak to exercise the FEC layer; strengthen it or F18 is stale"
            exit 1
          fi
          ./build/desktop-release/sim/ffsim --payload 65536 --seed 5 --fec-nsym 32 \
            --noise 26 --shot 0.9 --crosstalk 0.20 --occlusion 0.03 --drop 0.10
          echo "FEC off: failed as expected; FEC on: verified"

      # The replay harness is the path every real capture will arrive on, so it must be
      # proven faithful continuously, not once. Record a synthetic bundle, replay it, and
      # require the production chain to decode every frame.
      - name: Capture bundle records and replays
        run: |
          rm -rf /tmp/ci-bundle
          ./build/desktop-release/sim/ffsim --payload 16384 --image-path \
            --image-size 900 1500 --yaw 8 --blur 1 --record /tmp/ci-bundle
          OUT=$(./build/desktop-release/harness/ffreplay /tmp/ci-bundle)
          echo "$OUT"
          IN=$(echo  "$OUT" | awk '/frames in/ {print $3}')
          DEC=$(echo "$OUT" | awk '/frames decoded/ {print $3}')
          if [ "$IN" != "$DEC" ] || [ "$DEC" = "0" ]; then
            echo "::error::replay decoded $DEC of $IN frames — harness is not faithful"
            exit 1
          fi
          echo "replayed $DEC/$IN frames"

      # Guards finding F23: the adaptive link controller must score rungs by the CORRECTION
      # BUDGET (2*errors + erasures), not by the erasure load alone.
      #
      # This channel is the trap. Its worst erasure load is 9 at every rung, so an
      # erasure-only estimator predicts a perfect frame success rate at nsym=16 and
      # recommends it -- while the real decoder fails 11 of 117 frames there and loses 24%
      # of the goodput available at the optimum. The brute-force optimum is a 24/32/40
      # plateau (86.3 KB/s each, EXP-023), so any recommendation below 24 means the budget
      # term has been dropped again.
      - name: Adaptive controller must not recommend an under-protected rung
        run: |
          OUT=$(./build/desktop-release/sim/ffsim --payload 131072 --seed 5 --fec-nsym 32 \
                  --adapt --noise 26 --shot 0.9 --crosstalk 0.20 --occlusion 0.03 --drop 0.10)
          echo "$OUT"
          REC=$(echo "$OUT" | awk '/^recommended nsym/ {print $3}')
          if [ -z "$REC" ]; then
            echo "::error::--adapt produced no recommendation"
            exit 1
          fi
          if [ "$REC" -lt 24 ]; then
            echo "::error::controller recommended nsym=$REC on a channel whose optimum plateau"
            echo "::error::starts at 24. An erasure-only estimator gives exactly this answer —"
            echo "::error::see finding F23 and IntraFec::Stats::worst_budget_used."
            exit 1
          fi
          echo "recommended nsym=$REC (>= 24, inside the measured optimal plateau)"

      # Guards finding F15: localisation must not depend on payload content. A zero-padded
      # tail is entirely normal and used to make the screen undetectable.
      - name: Image path must not depend on payload content
        run: |
          OUT=$(./build/desktop-release/sim/ffsim --payload 16384 --image-path \
                  --image-size 1200 2000 --no-tracking)
          echo "$OUT"
          FAILS=$(echo "$OUT" | awk '/detection failures/ {print $3}')
          if [ "$FAILS" != "0" ]; then
            echo "::error::$FAILS detection failures — localisation is payload-dependent (F15)"
            exit 1
          fi
          echo "no detection failures"

  fuzz-smoke:
    name: libFuzzer smoke (Linux only — Apple clang ships no libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure
        run: cmake --preset desktop-fuzz
        env:
          CC: clang
          CXX: clang++
      - run: cmake --build build/desktop-fuzz -j
      - name: Time-boxed fuzz run
        run: |
          for t in fuzz_frame_header fuzz_manifest fuzz_header_codec fuzz_reed_solomon \
                   fuzz_screen_detect; do
            echo "--- $t ---"
            ./build/desktop-fuzz/fuzz/$t -max_total_time=60 -print_final_stats=1
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*

  android-build:
    name: Android APK builds; core/ cross-compiles for arm64 (ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      # The runner's own Android SDK. The setup-android action broke when the runner moved to
      # command-line tools 16 (its licence step aborts), and nothing here needs it: accept the
      # licences and install the pinned packages with the sdkmanager that is already there.
      - name: Install the pinned NDK and CMake
        run: |
          # Versions are pinned in app/build.gradle.kts (NDK r29, CMake 3.22). Keep them in step.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-37.0"
      # Gradle itself, at the version gradle/wrapper/gradle-wrapper.properties names. The
      # repository carries no wrapper JAR (no binaries are committed), so it is provisioned here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Assemble, unit tests, lint
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: The APK must contain exactly one .so, arm64 only
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SOS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/[^ ]+\.so' | sort)
          echo "$SOS"
          COUNT=$(echo "$SOS" | grep -c '\.so$')
          if [ "$COUNT" != "1" ]; then
            echo "::error::$COUNT shared libraries in the APK. ADR-0013 permits exactly one with"
            echo "::error::c++_static — a second requires switching to c++_shared in the SAME change,"
            echo "::error::or allocating in one .so and freeing in another corrupts the heap."
            exit 1
          fi
          if ! echo "$SOS" | grep -q 'lib/arm64-v8a/libfileflow.so'; then
            echo "::error::expected lib/arm64-v8a/libfileflow.so (ADR-0013: arm64 only)"
            exit 1
          fi
          echo "one .so, arm64-v8a, as ADR-0013 requires"
      - name: platform/android must not leak into core/
        run: |
          # ADR-0010 in the other direction: core/ may not depend on Android, and the Android
          # adapters may not smuggle logic back into core/ by including their own headers there.
          #
          # Matches an #include specifically, not any mention. capture_source.h names
          # platform/android/capture in a comment explaining its three implementations, which is
          # documentation rather than a dependency — a guard that cannot tell those apart trains
          # people to ignore it.
          if grep -rnE '^[[:space:]]*#[[:space:]]*include.*platform/android' \
               --include=*.cpp --include=*.h core/ harness/ sim/; then
            echo "::error::core/, harness/ and sim/ must not #include from platform/android"
            exit 1
          fi
          echo "no include leakage"
